<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Anais Carapaica — AI-powered Social Media Strategist">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#E01474"/>
      <stop offset="0.6" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2E88" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A3C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF7A3C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#141110" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <style>
      .f{font-family:'Space Grotesk','Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .float{animation:fl 7s ease-in-out infinite}
      .float2{animation:fl 9s ease-in-out infinite reverse}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .blink{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#FAF6F0"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <circle cx="1080" cy="40" r="300" fill="url(#blob1)"/>
    <circle cx="1220" cy="380" r="260" fill="url(#blob2)"/>

    <!-- left: text -->
    <g class="f">
      <rect x="72" y="70" width="318" height="34" rx="17" fill="#FFFDF9" stroke="#141110" stroke-opacity="0.14"/>
      <circle cx="94" cy="87" r="5" fill="#1C6B4C"/>
      <text x="108" y="92.5" font-size="14" font-weight="600" fill="#141110" letter-spacing="0.4">OPEN TO AI × SOCIAL PROJECTS</text>

      <text x="70" y="178" font-size="64" font-weight="700" fill="#141110" letter-spacing="-2">Anais Carapaica</text>
      <text x="72" y="232" font-size="30" font-weight="600" fill="url(#g)" letter-spacing="-0.5">AI-powered Social Media Strategist</text>
      <text x="72" y="276" font-size="19" fill="#6b6157">Brand · Paid Social · Content Systems · Data-driven storytelling</text>

      <g transform="translate(72 312)">
        <rect width="174" height="40" rx="20" fill="#141110"/>
        <text x="87" y="26" font-size="15" font-weight="600" fill="#FFFDF9" text-anchor="middle">1.6MM+ community</text>
        <rect x="186" width="138" height="40" rx="20" fill="#FFFDF9" stroke="#141110" stroke-opacity="0.18"/>
        <text x="255" y="26" font-size="15" font-weight="600" fill="#141110" text-anchor="middle">9 yrs in brand</text>
        <rect x="336" width="190" height="40" rx="20" fill="#FFFDF9" stroke="#141110" stroke-opacity="0.18"/>
        <text x="431" y="26" font-size="15" font-weight="600" fill="#141110" text-anchor="middle">🏆 2× industry award</text>
      </g>
    </g>

    <!-- right: AI prompt card -->
    <g transform="translate(810 70)"><g class="float">
      <rect width="400" height="198" rx="22" fill="#141110"/>
      <circle cx="26" cy="26" r="6" fill="#FF2E88"/><circle cx="46" cy="26" r="6" fill="#FF7A3C"/><circle cx="66" cy="26" r="6" fill="#FFFDF9" fill-opacity="0.3"/>
      <text x="380" y="31" class="f" font-size="12" fill="#FFFDF9" fill-opacity="0.45" text-anchor="end">prompt.md</text>
      <g class="f" font-size="15" fill="#FFFDF9">
        <text x="26" y="72" fill-opacity="0.5">// brief</text>
        <text x="26" y="98"><tspan fill="#FF7A3C">brand</tspan>: "fitness coach, 1.6MM"</text>
        <text x="26" y="122"><tspan fill="#FF7A3C">goal</tspan>: "+saves, +DMs, −CPA"</text>
        <text x="26" y="146"><tspan fill="#FF7A3C">ai</tspan>.draft(hooks, 10) → <tspan fill="#FF2E88">human</tspan>.edit()</text>
        <text x="26" y="176" fill-opacity="0.6">&gt; measuring what matters<tspan class="blink">▌</tspan></text>
      </g>
    </g></g>
    <g transform="translate(900 290)"><g class="float2">
      <rect width="250" height="64" rx="18" fill="#FFFDF9" stroke="#141110" stroke-opacity="0.12"/>
      <text x="22" y="28" class="f" font-size="12" fill="#6b6157" letter-spacing="0.6">PAID SOCIAL CPA</text>
      <text x="22" y="52" class="f" font-size="22" font-weight="700" fill="#141110">0,25 €</text>
      <polyline points="130,46 150,40 168,42 186,30 206,32 228,18" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>
  </g>
</svg>
